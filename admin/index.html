<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>管理台 · 开心软件市场</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316150f'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='900' fill='%23d2401c' text-anchor='middle'%3E%E5%8F%B0%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/assets/admin.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <div class="rail__brand">
          <span class="brand__mark" aria-hidden="true">台</span>
          <div class="rail__brandtext">
            <div class="rail__title" data-site-name>开心软件市场</div>
            <div class="rail__sub">Console</div>
          </div>
        </div>

        <div class="rail__group">
          <p class="rail__label">库存概览</p>
          <dl>
            <div class="rail__stat"><dt>应用总数</dt><dd data-stat="total">—</dd></div>
            <div class="rail__stat"><dt>已上架</dt><dd class="is-accent" data-stat="published">—</dd></div>
            <div class="rail__stat"><dt>未上架</dt><dd data-stat="draft">—</dd></div>
            <div class="rail__stat"><dt>已有包体</dt><dd data-stat="withPackage">—</dd></div>
            <div class="rail__stat"><dt>累计下载</dt><dd data-stat="downloads">—</dd></div>
          </dl>
        </div>

        <div class="rail__foot">
          <div class="rail__footrow"><span>前台站点</span><b id="rail-public"></b></div>
          <div class="rail__footrow"><span>后台管理</span><b id="rail-admin"></b></div>
        </div>
      </aside>

      <main class="main" id="main">
        <div class="topbar">
          <h1 class="topbar__title" id="topbar-title">
            应用管理
            <small id="board-count">正在载入…</small>
          </h1>
          <div class="tabs" id="view-tabs">
            <button type="button" data-view="apps" aria-pressed="true">应用</button>
            <button type="button" data-view="settings" aria-pressed="false">站点设置</button>
          </div>
          <label class="field-inline apps-only">
            <span>搜索</span>
            <input type="search" id="q" placeholder="应用名 / 开发者 / 包名" autocomplete="off" />
          </label>
          <select class="filter apps-only" id="status-filter">
            <option value="">全部状态</option>
            <option value="1">已上架</option>
            <option value="0">未上架</option>
          </select>
          <button class="btn btn--accent apps-only" type="button" id="create">＋ 新建应用</button>
        </div>

        <div class="board apps-only">
          <div class="board__head" aria-hidden="true">
            <span>序</span>
            <span>应用</span>
            <span class="col-hide">分类</span>
            <span class="col-hide">版本</span>
            <span class="col-hide">体积</span>
            <span>状态</span>
            <span class="col-hide">下载</span>
            <span>操作</span>
          </div>
          <div id="rows"></div>
        </div>

        <section class="settings" id="settings-view" hidden>
          <p class="fieldset-title">站点文案</p>
          <div class="grid2">
            <div class="field">
              <label for="s-siteName">站点名称</label>
              <input id="s-siteName" type="text" maxlength="60" />
            </div>
            <div class="field">
              <label for="s-siteSlogan">站点标语</label>
              <input id="s-siteSlogan" type="text" maxlength="120" />
            </div>
          </div>

          <p class="fieldset-title">首屏</p>
          <div class="field">
            <label for="s-heroKicker">小标签</label>
            <input id="s-heroKicker" type="text" maxlength="60" />
          </div>
          <div class="field">
            <label for="s-heroTitle">大标题</label>
            <input id="s-heroTitle" type="text" maxlength="120" />
            <p class="field__hint">用回车换行；用 *星号* 包住想强调的词，它会变成强调色。</p>
          </div>
          <div class="field">
            <label for="s-heroSubtitle">副标题</label>
            <input id="s-heroSubtitle" type="text" maxlength="200" />
          </div>
          <div class="grid2">
            <div class="field">
              <label for="s-statAppsLabel">统计标签 · 上架数</label>
              <input id="s-statAppsLabel" type="text" maxlength="20" />
            </div>
            <div class="field">
              <label for="s-statDownloadsLabel">统计标签 · 下载数</label>
              <input id="s-statDownloadsLabel" type="text" maxlength="20" />
            </div>
          </div>

          <p class="fieldset-title">外观与列表</p>
          <div class="grid2">
            <div class="field">
              <label for="s-accentColor">强调色</label>
              <div class="swatch">
                <input id="s-accentColor" type="color" />
                <code id="s-accent-value">#d2401c</code>
              </div>
            </div>
            <div class="field">
              <label for="s-defaultPageSize">每页条数</label>
              <input id="s-defaultPageSize" type="number" min="1" max="100" step="1" />
            </div>
          </div>
          <div class="field">
            <label for="s-footerNote">页脚说明</label>
            <input id="s-footerNote" type="text" maxlength="120" />
          </div>

          <div class="settings__foot">
            <button class="btn btn--quiet" type="button" id="settings-reset">恢复默认</button>
            <span class="spacer"></span>
            <button class="btn btn--accent" type="button" id="settings-save">保存设置</button>
          </div>
        </section>
      </main>
    </div>

    <div id="modal-root"></div>
    <div class="toaster" id="toaster"></div>
    <datalist id="category-list"></datalist>

    <script type="module" src="/assets/admin.js"></script>
  </body>
</html>

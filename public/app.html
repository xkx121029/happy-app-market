<!doctype html>
<html lang="zh-CN">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"

    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="wrap masthead__inner">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">开</span>
          <span class="brand__name" data-site-name>开心软件市场</span>
          <span class="brand__sub">App Archive</span>
        </a>
        <div class="masthead__meta">
          <span><span class="pulse" aria-hidden="true"></span>在线</span>
          <span>收录 <b data-stat-total>—</b></span>
          <span>下载 <b data-stat-downloads>—</b></span>

    <main class="wrap page">
      <a class="backlink" href="/"><span aria-hidden="true">◂</span> 返回应用目录</a>
      <div id="sheet-root">
        <div class="sheet">
          <aside class="sheet__card"><div class="skeleton"><i class="tall"></i></div></aside>
          <section class="sheet__main"><div class="skeleton"><i></i></div></section>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="wrap footer__inner">
        <span data-site-name>开心软件市场</span>
        <span>应用包体由管理员人工上架 · 下载前请核对版本与体积</span>
        <span id="build-stamp"></span>
      </div>
    </footer>

    <script type="module" src="/assets/app.js"></script>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#23272c" />
    <title>应用详情 · 开心软件市场</title>
    <script>
      // 先于样式执行，避免明暗切换时的闪白
      (function () {
        try {
          var t = localStorage.getItem('kx-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字体表改为非阻塞加载：网络不通时先用系统无衬线字体渲染，不卡首屏 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" />
    </noscript>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6f9f'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E%E5%BC%80%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="wrap masthead__inner">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">开</span>
          <span class="brand__name" data-site-name>开心软件市场</span>
        </a>
        <div class="masthead__meta">
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换明暗模式" title="切换明暗模式">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" /></svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" /></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="wrap page">
      <a class="backlink" href="/"><span aria-hidden="true">◂</span> 返回应用目录</a>
      <div id="sheet-root">
        <div class="sheet">
          <aside class="sheet__card"><div class="skeleton"><i class="tall"></i></div></aside>
          <section class="sheet__main"><div class="skeleton"><i></i></div></section>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="wrap footer__inner">
        <span data-site-name>开心软件市场</span>
        <span data-footer-note>下载前请核对版本与体积</span>
        <span id="build-stamp"></span>
      </div>
    </footer>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>开心软件市场</title>
    <meta name="description" content="自己写的软件都放在这里，点开就能下载。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d2401c'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='900' fill='white' text-anchor='middle'%3E%E5%BC%80%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="wrap masthead__inner">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">开</span>
          <span class="brand__name" data-site-name>开心软件市场</span>
        </a>
        <div class="masthead__meta">
          <span>收录 <b data-stat-total>—</b></span>
          <span>下载 <b data-stat-downloads>—</b></span>
        </div>
      </div>
    </header>

    <section class="nameplate">
      <div class="wrap nameplate__inner">
        <h1 class="nameplate__title">自己写的软件，都放在这儿</h1>
        <p class="nameplate__desc">看中哪个点进去，直接下载安装包。</p>
      </div>
    </section>

    <div class="searchbar">
      <div class="wrap searchbar__inner">
        <label class="searchbar__field">
          <span class="searchbar__tag">检索</span>
          <input
            type="search"
            id="q"
            placeholder="输入应用名、开发者或包名…"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <main class="wrap catalog">
      <div class="catalog__bar">
        <div>
          <h2 class="catalog__title">应用目录</h2>
          <p class="catalog__count" id="catalog-count">正在载入…</p>
        </div>
        <div class="sortbar" id="sortbar" role="group" aria-label="排序方式">
          <button type="button" data-sort="latest" aria-pressed="true">最新上架</button>
          <button type="button" data-sort="downloads" aria-pressed="false">最多下载</button>
          <button type="button" data-sort="name" aria-pressed="false">名称排序</button>
        </div>
      </div>

      <div class="listing">
        <div class="listing__head" aria-hidden="true">
          <span>序</span>
          <span>应用</span>
          <span class="col-cat">分类</span>
          <span class="col-ver">版本</span>
          <span class="col-size">体积</span>
          <span class="col-dl">下载</span>
          <span>操作</span>
        </div>
        <div id="entries"></div>
      </div>

      <nav class="pager" id="pager" hidden>
        <button class="btn btn--sm" type="button" id="prev">上一页</button>
        <span class="pager__info" id="pageinfo">1 / 1</span>
        <button class="btn btn--sm" type="button" id="next">下一页</button>
      </nav>
    </main>

    <footer class="footer">
      <div class="wrap footer__inner">
        <span data-site-name>开心软件市场</span>
        <span>下载前请核对版本与体积</span>
        <span id="build-stamp"></span>
      </div>
    </footer>

    <script type="module" src="/assets/site.js"></script>
  </body>
</html>

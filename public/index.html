<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#23272c" />
    <title>开心软件市场</title>
    <meta name="description" content="自己写的软件都放在这里，点开就能下载。" />
    <script>
      // 先于样式执行，避免明暗切换时的闪白
      (function () {
        try {
          var t = localStorage.getItem('kx-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字体表改为非阻塞加载：网络不通时先用系统无衬线字体渲染，不卡首屏 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" />
    </noscript>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6f9f'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E%E5%BC%80%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="wrap masthead__inner">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">开</span>
          <span class="brand__name" data-site-name>开心软件市场</span>
        </a>
        <div class="masthead__meta">
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换明暗模式" title="切换明暗模式">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" /></svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" /></svg>
          </button>
        </div>
      </div>
    </header>

    <section class="intro">
      <div class="wrap intro__inner">
        <div class="intro__text">
          <p class="intro__kicker" data-hero-kicker>自己写的软件</p>
          <h1 class="intro__title" data-hero-title>挑一个趁手的软件</h1>
          <p class="intro__sub" data-hero-sub>看中哪个点进去，直接下载安装包。</p>
        </div>
        <dl class="intro__stats">
          <div class="intro__stat">
            <dt data-stat-apps-label>在架应用</dt>
            <dd data-stat-total>—</dd>
          </div>
          <div class="intro__stat">
            <dt data-stat-downloads-label>累计下载</dt>
            <dd data-stat-downloads>—</dd>
          </div>
        </dl>
      </div>
    </section>

    <div class="searchbar">
      <div class="wrap searchbar__inner">
        <div class="searchbar__field">
          <label class="searchbar__tag" for="q">检索</label>
          <div class="searchbar__box">
            <input
              type="search"
              id="q"
              placeholder="输入应用名、开发者或包名…"
              autocomplete="off"
              spellcheck="false"
              role="combobox"
              aria-expanded="false"
              aria-controls="suggest"
              aria-autocomplete="list"
            />
            <div class="suggest" id="suggest" role="listbox" hidden></div>
          </div>
        </div>
        <p class="searchbar__hint">按 <kbd>/</kbd> 快速搜索，<kbd>Esc</kbd> 清空</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <main class="wrap catalog">
      <div class="catalog__bar">
        <div>
          <h2 class="catalog__title">应用目录</h2>
          <p class="catalog__count" id="catalog-count">正在载入…</p>
        </div>
        <div class="sortbar" id="sortbar" role="group" aria-label="排序方式">
          <button type="button" data-sort="latest" aria-pressed="true">最新上架</button>
          <button type="button" data-sort="downloads" aria-pressed="false">最多下载</button>
          <button type="button" data-sort="name" aria-pressed="false">名称排序</button>
        </div>
      </div>

      <div class="listing">
        <div class="listing__head" aria-hidden="true">
          <span>序</span>
          <span>应用</span>
          <span class="col-cat">分类</span>
          <span class="col-ver">版本</span>
          <span class="col-size">体积</span>
          <span class="col-dl">下载</span>
          <span>操作</span>
        </div>
        <div id="entries"></div>
      </div>

      <nav class="pager" id="pager" hidden>
        <button class="btn btn--sm" type="button" id="prev">上一页</button>
        <span class="pager__info" id="pageinfo">1 / 1</span>
        <button class="btn btn--sm" type="button" id="next">下一页</button>
      </nav>
    </main>

    <footer class="footer">
      <div class="wrap footer__inner">
        <span data-site-name>开心软件市场</span>
        <span data-footer-note>下载前请核对版本与体积</span>
        <span id="build-stamp"></span>
      </div>
    </footer>

    <script type="module" src="/assets/site.js"></script>
  </body>
</html>
